# Candidate B: NVFP4 W4A16 standard (block-16, max scaling, single weight_scale)
# on all linear weights per the w4a16_nvfp4 preset; default_disabled_quantizers
# keeps lm_head/mtp/routers/linear_attn/vision BF16. FP8 KV cast embedded.
# Composed from ModelOpt dev main @ 913f5e224 recipe library.

imports:
  base_disable_all: configs/ptq/units/base_disable_all
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  w4_nvfp4: configs/ptq/units/w4_nvfp4
  kv_fp8_cast: configs/ptq/units/kv_fp8_cast

metadata:
  recipe_type: ptq
  description: >-
    W4A16 NVFP4 (block-16 max) weight-only, full BF16 activations,
    FP8 KV cache (constant amax). Candidate B for Ornith-1.5-35B-A3B.

quantize:
  algorithm: max
  quant_cfg:
    - $import: base_disable_all
    - $import: w4_nvfp4
    - $import: default_disabled_quantizers
    - $import: kv_fp8_cast
